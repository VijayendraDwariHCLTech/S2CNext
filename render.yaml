services:
  - type: web
    name: s2cnext-web
    runtime: docker
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FOUNDRY_APP_KEY
        sync: false
      - key: FOUNDRY_APP_SECRET
        sync: false
